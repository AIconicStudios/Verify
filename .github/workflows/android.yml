name: Android APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Install web app and scanning libraries
        run: |
          npm ci
          node scripts/vendor.js

      - name: Copy web app into the Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk verify.apk

      - uses: actions/upload-artifact@v4
        with:
          name: verify-apk
          path: verify.apk

      # Keep one rolling release so the download link never changes.
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk verify.apk \
            --target "$GITHUB_SHA" \
            --title "Verify for Android" \
            --notes "Latest build of the Verify app. Download verify.apk on your Android phone and open it to install."
